<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- En base al siguiente código, añadir una función para pasar de Farenheit a Celsius: (0,5 puntos) -->

    <script>
        let pasaraFahrenheit = (grado) => {return grado * 1.8 + 32;};

        var resultado1 = pasaraFahrenheit(22);
        alert(resultado1);

        let pasaraCelsius = (grado) => {return (grado - 32) / 1.8;};

        var resultado2 = pasaraCelsius(86);
        alert(resultado2);

    </script>
</body>
</html>
