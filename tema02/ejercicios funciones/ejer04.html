<body>
    <!-- 4. Crea un programa con una función que reciba 2 números por parámetro, el primer número indicará cuantas veces debemos imprimir el segundo por pantalla, pero en cada iteración muestra el valor anterior multiplicado por 2. 
        − Ejemplo: Si recibimos 4 y 6 imprimiremos: 6 12 24 48 
        Llama a la función varias veces. (0,5 puntos) -->
        
        <script>
            var funcion = function(num1, num2) {

                let resultado = "";

                for (let i = 0; i < num1; i++) {
                    resultado += num2 + " ";
                    num2 *= 2;
                }

                console.log(resultado);
            }

            funcion(4, 6);

            funcion(9, 3);

            funcion(5, 8);
        </script>
</body>
