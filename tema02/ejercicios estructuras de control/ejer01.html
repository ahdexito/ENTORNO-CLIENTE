<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 1. Escribe un programa que verifique si el número introducido por prompt es positivo, negativo o cero e imprima el resultado.(if)(0,5puntos) -->

    <script>
        var numero = prompt("Introduce un número.");

        if (numero > 0) {
            alert("El número " + numero + " es positivo.");
        }
        else if (numero < 0) {
            alert("El número " +  numero + " es negativo.");
        }
        else alert("El número es 0.");
    </script>
</body>
</html>
