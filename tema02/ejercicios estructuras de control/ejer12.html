<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 12. Utilizando el método prompt(), solicita al usuario que introduzca un carácter cualquiera. Repite el ejercicio anterior usando el bucle while, pero al dibujar el patrón anterior por la consola utiliza el carácter introducido por el usuario. (0,75 puntos) -->

    <script>
        var caracter = prompt("Introduce un carácter.");
        var resultado = "";

        let i = 0;
        while (i < 12) {
            resultado += caracter;
            console.log(resultado);

            i++;
        }

    </script>
</body>
</html>
