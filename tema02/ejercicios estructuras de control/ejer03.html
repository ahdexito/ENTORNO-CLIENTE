<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 3. Crea un programa por el que se pueda introducir dos números e imprima el mayor. (if) (0,5 puntos) -->

    <script>
        var numero1 = prompt("Introduce el primer número.");
        var numero2 = prompt("Introduce el segundo número.");

        if (numero1 > numero2) {
            alert("El número mayor es el " + numero1);
        }
        else alert("El número mayor es el " + numero2);
    </script>
</body>
</html>
