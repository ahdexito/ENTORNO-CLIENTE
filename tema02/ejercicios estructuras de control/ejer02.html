<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 2. Crea un programa que determine, por la edad introducida, si una persona es menor de edad, adulta o anciana. (if) (0,5 puntos) -->

    <script>
        var edad = prompt("Introduce tu edad.");

        if (edad < 18) {
            alert("Eres menor de edad.");
        }
        else if (edad < 65) {
            alert("Eres una persona adulta.");
        }
        else alert("Eres una persona anciana.");
    </script>
</body>
</html>
