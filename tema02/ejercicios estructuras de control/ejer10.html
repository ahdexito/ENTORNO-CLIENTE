<body>
    <!-- 10. El factorial de un número entero n es una operación matemática que consiste en multiplicar ese número por todos los enteros menores que él: n x (n-1) x (n-2) x … x 1. Así, el factorial de 5 (se escribe 5!) vale 5! = 5 x 4 x 3 x 2 x 1 = 120. Haz un script que calcule el factorial de un número entero. (for con contador) (1 punto) -->

    <script>
        var numero = 5;
        var resultado = 1;

        if (numero <= 0) {
            console.log("No se puede calcular el factorial.");
        }
        else {
            for (let i = numero; i > 0; i--) {
                resultado *= numero--; 
            }

        console.log("El resultado es " + resultado);
        }
    </script>
</body>
</html>
