<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer11</title>
</head>
<body>
    <input id="usuario" value="">
    <p id="error"></p>

    <script>
        let usuario = document.getElementById("usuario").value;
        let error = document.getElementById("error");

        if (usuario.trim() === "") {
            error.textContent = "El usuario está vacío.";
        }
        else {
            error.textContent = "";
        }
    </script>
</body>
</html>
