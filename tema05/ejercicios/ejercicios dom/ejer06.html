<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer06</title>
</head>
<body>
    <p id="origen">Pequeño,Mediano,Grande</p>
    <select id="tallas"></select>

    <script>
        // obtener el texto
        let texto = document.getElementById("origen").textContent;

        // separar opciones
        let opciones = texto.split(",").map(item => item.trim());

        // obtener select
        let select = document.getElementById("tallas");

        // crear cada opción
        opciones.forEach(opcion => {
            let opt = document.createElement("option");
            opt.textContent = opcion;
            opt.value = opcion;
            select.appendChild(opt);
        });

    </script>
</body>
</html>
