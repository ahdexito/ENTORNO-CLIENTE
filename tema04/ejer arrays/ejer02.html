<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer02</title>

    <!-- 2. Crea un script que contenga un array con los valores siguientes: (0,5
    puntos)
    Dragonborn, Skyrim, Dovahkiin, Dragon, Fire, Game
    - Muestra por pantalla: El número de elementos que tiene el array y el
    contenido del array.
    - Utiliza el método push() para añadir los elementos siguientes:
    Videojuego, Dragones
    - Muestra por pantalla: El número de elementos que tiene el array y el
    contenido del array.
    - Solicita al usuario que introduzca una cadena de caracteres y
    añádela al array.
    - Muestra por pantalla: El número de elementos que tiene el array y el
    contenido del array. -->
</head>
<body>
    <script>
        // definir array
        let palabras = ["Dragonborn", "Skyrim", "Dovahkiin", "Dragon", "Fire", "Game"];

        // mostrar cantidad y elementos
        alert("El array tiene los siguientes " + palabras.length + " elementos: " + palabras.join(", "));

        // añadir dos elementos
        palabras.push("Videojuego", "Dragones");

        // mostrar cantidad y elementos
        alert("El array tiene los siguientes " + palabras.length + " elementos: " + palabras.join(", "));

        // solicitar elemento y añadir al array
        palabras.push(prompt("Introduce nuevo elemento"));

        // mostrar cantidad y elementos
        alert("El array tiene los siguientes " + palabras.length + " elementos: " + palabras.join(", "));
    </script>
</body>
</html>
