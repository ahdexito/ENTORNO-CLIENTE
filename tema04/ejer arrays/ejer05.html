<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer05</title>

    <!-- 5. Crea un script que contenga un array con los valores siguientes: (0,5
    puntos)
    Dragonborn, Skyrim, Dovahkiin, Dragon, Fire, Game
    - Muestra por pantalla: El número de elementos que tiene el array y el
    contenido del array.
    - Utiliza el método shift() para eliminar el primer elemento del array.
    - Muestra por pantalla: El número de elementos que tiene el array y el
    contenido del array.
    - Muestra por pantalla: El elemento eliminado del array. -->
</head>
<body>
    <script>
        // definir array
        let palabras = ["Dragonborn", "Skyrim", "Dovahkiin", "Dragon", "Fire", "Game"];

        // mostrar cantidad y elementos
        alert("El array tiene los siguientes " + palabras.length + " elementos: " + palabras.join(", "));

        // eliminar último elemento
        let eliminado = palabras.shift();

        // mostrar cantidad y elementos
        alert("El array tiene los siguientes " + palabras.length + " elementos: " + palabras.join(", "));

        // mostrar elemento eliminado
        alert("El elemento eliminado es: " + eliminado);
    </script>
</body>
</html>
