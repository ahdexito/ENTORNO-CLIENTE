        var texto = "Estamos a 2 días del finde y faltan 90 días para fin del año 2025";

        var suma_digitos = function(entrada) {
            try {
                let resultado = 0;

                // recorrer caracter uno a uno
                for (let i = 0; i < entrada.length; i++) {
                    let caracter = entrada.charAt(i);
                    let numero = Number(caracter);

                    // comprobar si el caracter es número y sumarlo
                    if (!isNaN(numero) && caracter !== " ") resultado += numero;
                }

                return resultado;
            } 
            
            catch (error) {
                console.error("Error:", error);
                alert("Error al sumar los dígitos.");
                return 0;
            }
        }

        alert(suma_digitos(texto));

    </script>
