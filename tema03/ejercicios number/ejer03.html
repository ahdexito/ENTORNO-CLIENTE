<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer03</title>

    <!-- 3. Realiza una función qu devuelve el cubo de un número y que compruebe si el parámetro pasado es un número entero. Si no es un entero o no es un número mostrará un alert indicando cuál es el problema y devolverá false. (1,5 puntos) -->
</head>
<body>
    <script>

        var numero = 3;
        var decimal = 3.3;
        var texto = "3";

        var calcular_cubo = function(entrada) {
            
            // comprobar si es un número
            if (typeof entrada !== "number" || isNaN(entrada)) {
                // si no lo es, la función no continúa y devuelve false
                alert("'" + entrada + "' no es un número.");
                return false;
            }
            // comprobar si es un entero
            if (!Number.isInteger(entrada)) {
                // si no lo es, la función no continúa y devuelve false
                alert("'" + entrada + "' no es un número entero.");
                return false;
            }
            
            let resultado = entrada * entrada * entrada;
            alert("El cubo de " + entrada + " es: " + resultado);
        }

        calcular_cubo(numero);
        calcular_cubo(decimal);
        calcular_cubo(texto);
    </script>
</body>
</html>
