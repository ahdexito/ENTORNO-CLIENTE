<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer02</title>

    <!-- 2. Crea un programa en el que crees 5 variables numéricas (entero, decimal, científico, octal y hexadecimal). A las variables les asignarás los siguientes números: 1357, 135.7, 135e7, 0o1357 y 0x1357. Muestra con 5 alerts su valor, escribiendo la siguiente sentencia: alert(“Número entero” + entero);
    Comenta el código con los comentarios que estimes necesarios. (1,5 puntos) -->
</head>
<body>
    <script>
        let entero = 1357;
        let decimal = 135.7;
        let exponente = 135e7;
        let octal = 0o1357;
        let hexadecimal = 0x1357;

        alert("Número entero: " + entero);
        alert("Número decimal: " + decimal);
        alert("Número con exponente: " + exponente);
        alert("Número octal: " + octal);
        alert("Número hexadecimal: " + hexadecimal);
    </script>
</body>
</html>
