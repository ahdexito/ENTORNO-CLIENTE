<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer08</title>
</head>
<body>
    <form>
        <label>No se aceptan dígitos</label>
        <input type="text" id="letras">
    </form>

    <script>
        const inputLetras = document.getElementById("letras");

        inputLetras.addEventListener("keydown", e => {
            if (e.key >= '0' && e.key <= '9') {
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
