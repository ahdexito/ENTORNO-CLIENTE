<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer02</title>
    <style>
        div {
            background-color: cornflowerblue;
            color: white;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: 2em;
            width: 200px;
            padding: 30px;
            margin: 0 auto;
            text-align: center;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div onmouseover="color()">Pasar por aquí</div>
    <div id="efecto">Efectos de movimiento</div>

    <script>
        function color() {
            document.getElementById("efecto").style.backgroundColor = "green";
        }
    </script>
</body>
</html>
