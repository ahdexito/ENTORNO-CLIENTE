<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejer04</title>
    <script>
        window.onload = function() {
            const cuadro = document.getElementById("cuadro");

            cuadro.onmouseenter = function() {
                cuadro.style.backgroundColor = "red";
            };

            cuadro.onmouseleave = function() {
                cuadro.style.backgroundColor = "white";
            };
        };
    </script>
</head>
<body>
    <div style="display: block; width: 100px; height: 100px;"
        id="cuadro">
        Cuadro que cambia al entrar el ratón
    </div>
</body>
</html>
